<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления - ReUnityHandler</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }
        .user-info {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .nav-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #3498db;
        }
        .nav-card h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .nav-card p {
            color: #666;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .error {
            color: #e74c3c;
            padding: 10px;
            background: #f8d7da;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Панель управления ReUnityHandler</h1>
        </div>

        <div id="errorContainer" style="display: none;"></div>
        <div id="loading" class="loading">Загрузка информации о пользователе...</div>

        <div id="userInfo" class="user-info" style="display: none;">
            <h2 id="welcomeMessage"></h2>
            <p id="userDetails"></p>
            <button class="btn btn-danger" onclick="logout()">Выйти из системы</button>
        </div>

        <div id="navCards" class="nav-cards" style="display: none;">
            <a href="/cases" class="nav-card">
                <h3>📋 Управление случаями</h3>
                <p>Просмотр, создание и управление медицинскими случаями</p>
            </a>

            <a href="/patients" class="nav-card">
                <h3>👥 Пациенты</h3>
                <p>Управление базой данных пациентов</p>
            </a>
        </div>
    </div>

    <script>
        let token = null;
        let currentUser = null;

        // Функция для получения русского названия роли
        function getRoleName(role) {
            const roles = {
                'admin': 'Администратор',
                'head': 'Заведующий',
                'neurologist': 'Невролог',
                'therapist': 'Терапевт'
            };
            return roles[role] || role;
        }

        // Проверяем аутентификацию при загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            token = localStorage.getItem('auth_token');
            console.log('Токен из localStorage:', token ? 'Есть' : 'Нет');

            if (!token) {
                showError('Требуется авторизация. Перенаправляю на страницу входа...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                return;
            }

            await loadCurrentUser();
        });

        async function loadCurrentUser() {
            try {
                console.log('Загружаем информацию о пользователе...');
                const response = await fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                console.log('Ответ от /api/v1/auth/me:', response.status);

                if (response.ok) {
                    currentUser = await response.json();
                    console.log('Пользователь загружен:', currentUser.username);

                    // Показываем информацию о пользователе
                    document.getElementById('welcomeMessage').textContent =
                        `Добро пожаловать, ${currentUser.full_name}!`;

                    const roleName = getRoleName(currentUser.role);
                    document.getElementById('userDetails').textContent =
                        `Роль: ${roleName} | Активен: ${currentUser.is_active ? 'Да' : 'Нет'}`;

                    document.getElementById('userInfo').style.display = 'block';
                    document.getElementById('navCards').style.display = 'grid';
                    document.getElementById('loading').style.display = 'none';

                    // Добавляем карточку администрирования только для админа
                    if (currentUser.role === 'admin') {
                        const navCards = document.getElementById('navCards');
                        const adminCard = document.createElement('a');
                        adminCard.href = '/admin/doctors';
                        adminCard.target = '_self';
                        adminCard.className = 'nav-card';
                        adminCard.innerHTML = `
                            <h3>⚙️ Администрирование</h3>
                            <p>Управление пользователями и настройками</p>
                        `;
                        navCards.appendChild(adminCard);
                    }
                } else {
                    console.error('Ошибка загрузки пользователя:', response.status, response.statusText);
                    const errorText = await response.text();
                    console.error('Текст ошибки:', errorText);

                    showError('Сессия истекла или токен недействителен. Пожалуйста, войдите снова.');
                    setTimeout(() => {
                        localStorage.removeItem('auth_token');
                        window.location.href = '/';
                    }, 3000);
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователя:', error);
                showError('Ошибка подключения к серверу: ' + error.message);
                setTimeout(() => {
                    localStorage.removeItem('auth_token');
                    window.location.href = '/';
                }, 3000);
            }
        }

        function logout() {
            if (confirm('Вы уверены, что хотите выйти из системы?')) {
                localStorage.removeItem('auth_token');
                window.location.href = '/';
            }
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error">
                    <strong>Ошибка:</strong> ${message}
                </div>
            `;
            errorContainer.style.display = 'block';
        }
    </script>
</body>
</html>
