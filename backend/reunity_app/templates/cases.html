<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление случаями - ReUnityHandler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .filters {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .filter-group input, .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-draft {
            background: #f8f9fa;
            color: #6c757d;
        }
        .status-in_progress {
            background: #fff3cd;
            color: #856404;
        }
        .status-waiting_review {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        .status-sent {
            background: #cce5ff;
            color: #004085;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
            margin-bottom: 5px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .actions {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .error {
            color: #e74c3c;
            padding: 10px;
            background: #f8d7da;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .doctor-status {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .status-done {
            background: #27ae60;
            color: white;
        }
        .status-pending {
            background: #e74c3c;
            color: white;
        }
        .status-label {
            font-size: 10px;
            margin-top: 2px;
            text-align: center;
        }
        .no-cases {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Управление случаями</h1>
            <div class="actions">
                <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">
                    ← Назад в панель управления
                </button>
                <button class="btn btn-primary" onclick="window.location.href='/'">
                    🏠 Главная
                </button>
                <button class="btn btn-success" onclick="createNewCase()">
                    ＋ Создать новый случай
                </button>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="searchInput">Поиск по пациенту:</label>
                <input type="text" id="searchInput" placeholder="Фамилия, имя или отчество..."
                       onkeypress="if(event.key === 'Enter') applyFilters()">
            </div>
            <div class="filter-group">
                <label for="statusFilter">Статус:</label>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="">Все статусы</option>
                    <option value="draft">Черновик</option>
                    <option value="in_progress">В процессе</option>
                    <option value="waiting_review">На проверке</option>
                    <option value="completed">Завершен</option>
                    <option value="sent">Отправлен</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="dateFilter">Дата создания:</label>
                <input type="date" id="dateFilter">
            </div>
            <div class="filter-group">
                <label>&nbsp;</label>
                <button class="btn btn-primary" onclick="applyFilters()" style="width: auto;">
                    🔍 Применить фильтры
                </button>
                <button class="btn btn-secondary" onclick="clearFilters()" style="width: auto;">
                    🗑️ Сбросить
                </button>
            </div>
        </div>

        <div id="loading" class="loading">
            Загрузка случаев...
        </div>

        <div id="errorContainer" style="display: none;"></div>

        <div id="casesTable" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Пациент</th>
                        <th>Дата поступления</th>
                        <th>Создатель</th>
                        <th>Статус</th>
                        <th>Статус врачей</th>
                        <th>Создан</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="casesTableBody">
                    <!-- Данные будут загружены через JavaScript -->
                </tbody>
            </table>
            <div style="margin-top: 20px; text-align: center;">
                <button class="btn btn-secondary" onclick="loadMore()" id="loadMoreBtn" style="display: none;">
                    Загрузить еще
                </button>
            </div>
        </div>
    </div>

    <script>
        let token = null;
        let currentUser = null;
        let currentPage = 0;
        const limit = 20;
        let hasMore = true;
        let currentFilters = {
            search: '',
            status: '',
            date: ''
        };

        // Проверяем аутентификацию при загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            token = localStorage.getItem('auth_token');
            console.log('Токен из localStorage:', token ? 'Есть' : 'Нет');

            if (!token) {
                showError('Требуется авторизация. Перенаправляю на страницу входа...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                return;
            }

            await loadCurrentUser();
            await loadCases();
        });

        async function loadCurrentUser() {
            try {
                console.log('Загружаем информацию о пользователе...');
                const response = await fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                console.log('Ответ от /api/v1/auth/me:', response.status);

                if (response.ok) {
                    currentUser = await response.json();
                    console.log('Пользователь загружен:', currentUser.username);
                } else {
                    console.error('Ошибка загрузки пользователя:', response.status);
                    const errorText = await response.text();
                    console.error('Текст ошибки:', errorText);

                    showError('Сессия истекла. Пожалуйста, войдите снова.');
                    setTimeout(() => {
                        localStorage.removeItem('auth_token');
                        window.location.href = '/';
                    }, 3000);
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователя:', error);
                showError('Ошибка подключения к серверу: ' + error.message);
                setTimeout(() => {
                    localStorage.removeItem('auth_token');
                    window.location.href = '/';
                }, 3000);
            }
        }

        async function loadCases() {
            try {
                const loadingEl = document.getElementById('loading');
                loadingEl.style.display = 'block';
                document.getElementById('casesTable').style.display = 'none';
                document.getElementById('errorContainer').style.display = 'none';

                // Формируем URL с фильтрами
                let url = `/api/v1/cases/?skip=${currentPage * limit}&limit=${limit}`;

                if (currentFilters.search) {
                    url += `&search=${encodeURIComponent(currentFilters.search)}`;
                }

                if (currentFilters.status) {
                    url += `&status=${currentFilters.status}`;
                }

                if (currentFilters.date) {
                    // Для совместимости с API используем date_from и date_to с одинаковой датой
                    url += `&date_from=${currentFilters.date}&date_to=${currentFilters.date}`;
                }

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                console.log('Запрос к cases:', url, 'Статус:', response.status);

                if (response.ok) {
                    const cases = await response.json();
                    console.log('Получено случаев:', cases.length);
                    displayCases(cases);
                    updateLoadMoreButton(cases.length);
                } else if (response.status === 401) {
                    // Если не авторизован, перенаправляем на страницу входа
                    showError('Требуется авторизация. Перенаправляю на страницу входа...');
                    setTimeout(() => {
                        localStorage.removeItem('auth_token');
                        window.location.href = '/';
                    }, 2000);
                } else {
                    const errorText = await response.text();
                    showError('Ошибка загрузки случаев. Код ошибки: ' + response.status + ' - ' + errorText);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка подключения к серверу: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayCases(cases) {
            const tableBody = document.getElementById('casesTableBody');
            const casesTable = document.getElementById('casesTable');

            if (currentPage === 0) {
                tableBody.innerHTML = '';
            }

            if (cases.length === 0 && currentPage === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center;">
                            <div class="no-cases">
                                <p>Случаи не найдены</p>
                                ${currentUser.role === 'admin' || currentUser.role === 'head' || currentUser.role === 'therapist' ?
                                    '<button class="btn btn-primary" onclick="createNewCase()">Создать первый случай</button>' :
                                    ''}
                            </div>
                        </td>
                    </tr>
                `;
                casesTable.style.display = 'table';
                return;
            }

            cases.forEach(caseItem => {
                const row = document.createElement('tr');

                // Форматируем даты
                const admissionDate = caseItem.admission_date ?
                    new Date(caseItem.admission_date).toLocaleDateString('ru-RU') : 'Не указана';
                const createdDate = caseItem.created_at ?
                    new Date(caseItem.created_at).toLocaleDateString('ru-RU') : 'Не указана';

                // Определяем класс для статуса
                let statusClass = '';
                let statusText = '';
                switch(caseItem.status) {
                    case 'draft':
                        statusClass = 'status-draft';
                        statusText = 'Черновик';
                        break;
                    case 'in_progress':
                        statusClass = 'status-in_progress';
                        statusText = 'В процессе';
                        break;
                    case 'waiting_review':
                        statusClass = 'status-waiting_review';
                        statusText = 'На проверке';
                        break;
                    case 'completed':
                        statusClass = 'status-completed';
                        statusText = 'Завершен';
                        break;
                    case 'sent':
                        statusClass = 'status-sent';
                        statusText = 'Отправлен';
                        break;
                    default:
                        statusClass = 'status-draft';
                        statusText = caseItem.status || 'Неизвестно';
                }

                // Создаем статус врачей
                const doctorStatusHTML = `
                    <div class="doctor-status">
                        <div>
                            <div class="status-icon ${caseItem.neurologist_completed ? 'status-done' : 'status-pending'}">
                                ${caseItem.neurologist_completed ? '✓' : '✗'}
                            </div>
                            <div class="status-label">Невролог</div>
                        </div>
                        <div>
                            <div class="status-icon ${caseItem.therapist_completed ? 'status-done' : 'status-pending'}">
                                ${caseItem.therapist_completed ? '✓' : '✗'}
                            </div>
                            <div class="status-label">Терапевт</div>
                        </div>
                        <div>
                            <div class="status-icon ${caseItem.head_completed ? 'status-done' : 'status-pending'}">
                                ${caseItem.head_completed ? '✓' : '✗'}
                            </div>
                            <div class="status-label">Заведующий</div>
                        </div>
                    </div>
                `;

                // Определяем доступные действия
                let actions = '';

                // Документ доступен всем
                actions += `<button class="btn btn-primary" onclick="viewDocument(${caseItem.id})" title="Редактировать документ">
                                📝 Документ
                            </button>`;

                // Завершение доступно администраторам, заведующим
                if (currentUser.role === 'admin' || currentUser.role === 'head') {
                    actions += `<button class="btn btn-success" onclick="completeCase(${caseItem.id})"
                                ${caseItem.status === 'completed' || caseItem.status === 'sent' ? 'disabled style="opacity:0.5"' : ''}
                                title="Завершить случай">
                                ✅ Завершить
                            </button>`;
                }

                row.innerHTML = `
                    <td>${caseItem.id || 'N/A'}</td>
                    <td>${caseItem.patient_name || 'Не указан'}</td>
                    <td>${admissionDate}</td>
                    <td>${caseItem.creator_name || 'Неизвестно'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${doctorStatusHTML}</td>
                    <td>${createdDate}</td>
                    <td>${actions}</td>
                `;

                tableBody.appendChild(row);
            });

            casesTable.style.display = 'table';
        }

        function applyFilters() {
            currentFilters.search = document.getElementById('searchInput').value.trim();
            currentFilters.status = document.getElementById('statusFilter').value;
            currentFilters.date = document.getElementById('dateFilter').value;
            currentPage = 0;
            loadCases();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('dateFilter').value = '';
            currentFilters = { search: '', status: '', date: '' };
            currentPage = 0;
            loadCases();
        }

        function loadMore() {
            currentPage++;
            loadCases();
        }

        function updateLoadMoreButton(casesCount) {
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            hasMore = casesCount === limit;
            loadMoreBtn.style.display = hasMore ? 'inline-block' : 'none';
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error">
                    <strong>Ошибка:</strong> ${message}
                    <button onclick="location.reload()" style="float: right; background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">
                        Повторить
                    </button>
                </div>
            `;
            errorContainer.style.display = 'block';
        }

        async function viewDocument(caseId) {
            try {
                console.log('Проверяем документ для случая:', caseId);

                // Проверяем, есть ли документ для этого случая
                const response = await fetch(`/api/v1/documents?case_id=${caseId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const documents = await response.json();
                    console.log('Найдено документов:', documents.length);

                    if (documents.length > 0) {
                        // Переходим к редактированию существующего документа
                        window.location.href = `/document_edit?id=${documents[0].id}`;
                    } else {
                        // Создаем новый документ
                        if (confirm('Документ для этого случая не найден. Создать новый?')) {
                            const createResponse = await fetch('/api/v1/documents', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json',
                                    'Accept': 'application/json'
                                },
                                body: JSON.stringify({
                                    case_id: caseId,
                                    content: { sections: {} }
                                })
                            });

                            if (createResponse.ok) {
                                const newDoc = await createResponse.json();
                                window.location.href = `/document_edit?id=${newDoc.id}`;
                            } else {
                                const error = await createResponse.json();
                                alert(`Ошибка создания документа: ${error.detail || 'Неизвестная ошибка'}`);
                            }
                        }
                    }
                } else {
                    const errorText = await response.text();
                    alert(`Ошибка проверки документа: ${errorText || 'Неизвестная ошибка'}`);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка подключения к серверу: ' + error.message);
            }
        }

        async function completeCase(caseId) {
            if (!confirm('Вы уверены, что хотите завершить этот случай?')) {
                return;
            }

            try {
                const response = await fetch(`/api/v1/cases/${caseId}/complete`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    alert('Случай успешно завершен');
                    currentPage = 0;
                    await loadCases();
                } else {
                    const errorText = await response.text();
                    alert(`Ошибка: ${errorText || 'Не удалось завершить случай'}`);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка подключения к серверу: ' + error.message);
            }
        }

        function createNewCase() {
            window.location.href = '/case_create';
        }
    </script>
</body>
</html>
