<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пациентами - ReUnityHandler</title>
    <style>
        :root {
            --bg-light: #fffffa;
            --primary-dark: #0d5c63;
            --primary-medium: #44a1a0;
            --primary-light: #78cdd7;
            --primary-deep: #247b7b;
            --text-dark: #2c3e50;
            --text-light: #ffffff;
            --border-color: #b0d4d9;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            background: linear-gradient(135deg, #78cdd7 0%, #44a1a0 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(13, 92, 99, 0.9);
            color: var(--text-light);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }
        #user-info-header {
            background: var(--primary-dark);
            color: white;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1em;
        }
        .admin-nav {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .admin-nav .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .admin-nav .btn.active {
            background: var(--primary-medium);
            border-color: var(--primary-medium);
        }
        .content {
            background: #ffffff;
            padding: 20px;
            border-radius: 5px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .filters {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filters input {
            flex: 1 1 300px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        table {
            background: #ffffff;
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background-color: var(--primary-dark);
            color: white;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f0f8ff;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: var(--primary-medium); color: white; }
        .btn-success { background: var(--primary-deep); color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-secondary { background: var(--primary-light); color: var(--text-dark); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: var(--bg-light);
            margin: 10% auto;
            padding: 20px;
            border-radius: 5px;
            width: 500px;
            max-width: 90%;
        }
        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .no-patients {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="user-info-header">
            <span id="userName"></span>
            <span id="userRole"></span>
        </div>

        <div class="header">
            <h1>Управление пациентами</h1>
            <div class="admin-nav">
                <button class="btn" onclick="window.location.href='/admin/doctors'" id="doctorsNavBtn">👨‍⚕️ Врачи</button>
                <button class="btn active" onclick="window.location.href='/patients'">👥 Пациенты</button>
                <button class="btn" onclick="window.location.href='/dashboard'">← На главную</button>
            </div>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <div class="filters">
                <input type="text" id="searchInput" placeholder="Поиск по ФИО или номеру полиса...">
                <button class="btn btn-primary" onclick="searchPatients()">🔍 Поиск</button>
                <button class="btn btn-success" onclick="openCreateModal()">＋ Добавить пациента</button>
            </div>

            <div id="loading" class="loading">Загрузка пациентов...</div>

            <div id="patientsTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ФИО</th>
                            <th>Дата рождения</th>
                            <th>Номер полиса</th>
                            <th>Дата создания</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно для создания/редактирования пациента -->
    <div id="patientModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Добавление пациента</h3>
            <form id="patientForm">
                <input type="hidden" id="patientId">
                <div class="form-group">
                    <label for="lastName">Фамилия *</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="firstName">Имя *</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="middleName">Отчество</label>
                    <input type="text" id="middleName">
                </div>
                <div class="form-group">
                    <label for="birthDate">Дата рождения</label>
                    <input type="date" id="birthDate">
                </div>
                <div class="form-group">
                    <label for="insuranceNumber">Номер полиса</label>
                    <input type="text" id="insuranceNumber" maxlength="20">
                </div>
                <div style="text-align: right;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = '/';
        }

        let currentUser = null;
        let patients = [];
        let isPatientFormSubmitting = false;

        function disableButton(btn, disable, loadingText = 'Сохранение...') {
            if (disable) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.textContent = loadingText;
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || btn.textContent;
            }
        }

        function getRoleName(role) {
            const roles = {
                'reflexotherapist': 'Рефлексотерапевт',
                'physiotherapist': 'Физиотерапевт',
                'therapist_frm': 'Терапевт/Врач ФРМ',
                'neurologist_frm': 'Невролог/Врач ФРМ',
                'psychologist': 'Психолог',
                'admin': 'Администратор'
            };
            return roles[role] || role;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadPatients();
        });

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('userName').textContent = currentUser.full_name;
                    document.getElementById('userRole').textContent = getRoleName(currentUser.role);

                    // Скрываем кнопку "Врачи", если не админ
                    if (currentUser.role !== 'admin') {
                        document.getElementById('doctorsNavBtn').style.display = 'none';
                    }
                } else {
                    throw new Error('Ошибка загрузки пользователя');
                }
            } catch (error) {
                console.error(error);
                window.location.href = '/';
            }
        }

        async function loadPatients() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('patientsTable').style.display = 'none';

                const response = await fetch('/api/v1/patients/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    patients = await response.json();
                    displayPatients(patients);
                } else {
                    showAlert('Ошибка загрузки пациентов', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function searchPatients() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                await loadPatients();
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('patientsTable').style.display = 'none';

                const response = await fetch(`/api/v1/patients/search?q=${encodeURIComponent(searchTerm)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    patients = await response.json();
                    displayPatients(patients);
                } else {
                    showAlert('Ошибка поиска', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayPatients(patients) {
            const tbody = document.getElementById('patientsTableBody');
            const table = document.getElementById('patientsTable');
            tbody.innerHTML = '';

            if (patients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-patients">Пациенты не найдены</td></tr>';
                table.style.display = 'table';
                return;
            }

            patients.forEach(patient => {
                const row = tbody.insertRow();
                const birthDate = patient.birth_date
                    ? new Date(patient.birth_date).toLocaleDateString('ru-RU')
                    : '—';
                const created = new Date(patient.created_at).toLocaleDateString('ru-RU');

                const canDelete = currentUser && (currentUser.role === 'admin' || currentUser.role === 'head');

                row.innerHTML = `
                    <td>${patient.id}</td>
                    <td>${patient.last_name} ${patient.first_name} ${patient.middle_name || ''}</td>
                    <td>${birthDate}</td>
                    <td>${patient.insurance_number || '—'}</td>
                    <td>${created}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editPatient(${patient.id})">✏️</button>
                        ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deletePatient(${patient.id}, event)">🗑️</button>` : ''}
                    </td>
                `;
            });

            table.style.display = 'table';
        }

        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Добавление пациента';
            document.getElementById('patientId').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('firstName').value = '';
            document.getElementById('middleName').value = '';
            document.getElementById('birthDate').value = '';
            document.getElementById('insuranceNumber').value = '';
            document.getElementById('patientModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('patientModal').style.display = 'none';
        }

        async function editPatient(id) {
            const patient = patients.find(p => p.id === id);
            if (!patient) return;

            document.getElementById('modalTitle').textContent = 'Редактирование пациента';
            document.getElementById('patientId').value = patient.id;
            document.getElementById('lastName').value = patient.last_name;
            document.getElementById('firstName').value = patient.first_name;
            document.getElementById('middleName').value = patient.middle_name || '';
            document.getElementById('birthDate').value = patient.birth_date ? patient.birth_date.split('T')[0] : '';
            document.getElementById('insuranceNumber').value = patient.insurance_number || '';
            document.getElementById('patientModal').style.display = 'block';
        }

        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isPatientFormSubmitting) return;
            isPatientFormSubmitting = true;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            disableButton(submitBtn, true, 'Сохранение...');

            const id = document.getElementById('patientId').value;
            const isEditing = !!id;

            const data = {
                last_name: document.getElementById('lastName').value.trim(),
                first_name: document.getElementById('firstName').value.trim(),
                middle_name: document.getElementById('middleName').value.trim() || null,
                birth_date: document.getElementById('birthDate').value || null,
                insurance_number: document.getElementById('insuranceNumber').value.trim() || null
            };

            const url = isEditing ? `/api/v1/patients/${id}` : '/api/v1/patients/';
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert(isEditing ? 'Пациент обновлён' : 'Пациент создан', 'success');
                    closeModal();
                    await loadPatients();
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка сохранения', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            } finally {
                disableButton(submitBtn, false);
                isPatientFormSubmitting = false;
            }
        });

        async function deletePatient(id, event) {
            const button = event.target;
            disableButton(button, true, 'Удаление...');
            if (!confirm('Вы уверены, что хотите удалить этого пациента? Это действие необратимо.')) {
                disableButton(button, false);
                return;
            }

            try {
                const response = await fetch(`/api/v1/patients/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('Пациент удалён', 'success');
                    await loadPatients();
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка удаления', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            } finally {
                disableButton(button, false);
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            container.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('patientModal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
