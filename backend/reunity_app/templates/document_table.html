<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование документа - ReUnityHandler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .patient-info {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin-bottom: 20px;
        }
        .doctor-status {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .status-card {
            flex: 1;
            min-width: 200px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }
        .status-card.completed {
            border-left: 4px solid #27ae60;
        }
        .status-card.pending {
            border-left: 4px solid #f39c12;
        }
        .status-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .document-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        .document-table th,
        .document-table td {
            border: 1px solid #ddd;
            padding: 12px;
            vertical-align: top;
        }
        .document-table th {
            background: #2c3e50;
            color: white;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
        }
        .document-table tr:nth-child(even) {
            background: #f9f9f9;
        }
        .document-table tr:hover {
            background: #f5f5f5;
        }
        .row-label {
            width: 50%;
            font-weight: bold;
            background: #f8f9fa;
        }
        .cell-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        .cell-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        .cell-input.readonly {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        .cell-input.neurologist {
            border-left: 3px solid #3498db;
        }
        .cell-input.therapist {
            border-left: 3px solid #9b59b6;
        }
        .cell-input.head {
            border-left: 3px solid #e74c3c;
        }
        .row-doctor {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            display: inline-block;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-test {
            background: #9b59b6;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .total-row {
            background: #e8f4fc !important;
            font-weight: bold;
        }
        .header-row {
            background: #fff8e1 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Редактирование документа</h1>
            <div style="margin-top: 10px;">
                <button class="btn btn-secondary" onclick="window.location.href='/cases'">
                    ← Назад к списку случаев
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">
                    ← Панель управления
                </button>
            </div>
        </div>

        <div id="alertContainer"></div>
        <div id="loading" class="loading">Загрузка документа...</div>

        <div id="documentInfo" class="patient-info" style="display: none;">
            <h3>Информация о документе</h3>
            <p><strong>ID:</strong> <span id="docId"></span></p>
            <p><strong>Пациент:</strong> <span id="patientName"></span></p>
            <p><strong>Номер полиса:</strong> <span id="insuranceNumber"></span></p>
            <p><strong>Дата создания:</strong> <span id="createdAt"></span></p>
        </div>

        <div id="doctorStatus" class="doctor-status" style="display: none;">
            <div class="status-card" id="neurologistStatus">
                <div class="status-icon">🧠</div>
                <h4>Невролог</h4>
                <p id="neurologistText">Не заполнено</p>
                <p id="neurologistTime"></p>
            </div>
            <div class="status-card" id="therapistStatus">
                <div class="status-icon">🩺</div>
                <h4>Терапевт</h4>
                <p id="therapistText">Не заполнено</p>
                <p id="therapistTime"></p>
            </div>
            <div class="status-card" id="headStatus">
                <div class="status-icon">👨‍⚕️</div>
                <h4>Заведующий</h4>
                <p id="headText">Не заполнено</p>
                <p id="headTime"></p>
            </div>
        </div>

        <div id="documentActions" style="margin: 20px 0; display: none;">
            <button class="btn btn-success" onclick="completeMySection()" id="completeSectionBtn">
                ✓ Завершить мой раздел
            </button>
            <button class="btn btn-primary" onclick="saveAllChanges()" id="saveAllBtn">
                💾 Сохранить все изменения
            </button>
            <button class="btn btn-test" onclick="testSaveSingleRow()" id="testSaveBtn">
                🧪 Тест сохранения одной строки
            </button>
            <button class="btn btn-success" onclick="signDocument()" id="signDocumentBtn" style="display: none;">
                📝 Подписать документ
            </button>
            <span id="saveStatus" style="margin-left: 20px; color: #666;"></span>
        </div>

        <div id="documentTable" style="display: none;">
            <table class="document-table">
                <thead>
                    <tr>
                        <th>Показатель</th>
                        <th style="width: 25%;">До лечения</th>
                        <th style="width: 25%;">После лечения</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Таблица будет заполнена через JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('auth_token');
        let currentUser = null;
        let documentId = null;
        let documentData = null;
        let permissions = null;
        let doctorRows = null;
        let completionStatus = null;
        let unsavedChanges = new Set();
        let autoSaveTimer = null;
        let lastInputTime = 0;
        const INPUT_DEBOUNCE = 300; // 300ms задержка для логирования

        // Получаем ID документа из URL
        const urlParams = new URLSearchParams(window.location.search);
        documentId = urlParams.get('id');

        if (!documentId) {
            showAlert('ID документа не указан', 'danger');
            setTimeout(() => window.location.href = '/cases', 2000);
        }

        // Проверяем аутентификацию
        if (!token) {
            window.location.href = '/';
        }

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    currentUser = await response.json();
                } else {
                    throw new Error('Ошибка загрузки пользователя');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                window.location.href = '/';
            }
        }

        async function loadDocumentStructure() {
            try {
                showLoading(true);
                console.log('🚀 Загрузка структуры документа...');

                // Загружаем структуру документа
                const response = await fetch(`/api/v1/document-table/${documentId}/structure`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    documentData = data.table_data;
                    permissions = data.permissions;
                    doctorRows = data.doctor_rows;
                    completionStatus = data.completion_status;

                    console.log('📄 Полученные данные структуры:', data);

                    // Загружаем информацию о документе
                    await loadDocumentInfo();

                    // Отображаем интерфейс
                    displayDocumentInfo();
                    displayDoctorStatus();
                    displayDocumentTable();
                    setupAutoSave();

                    showLoading(false);

                    // Отладочная проверка DOM через 500мс после загрузки
                    setTimeout(debugDOM, 500);

                } else {
                    throw new Error('Ошибка загрузки документа');
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки структуры документа:', error);
                showAlert('Ошибка загрузки документа: ' + error.message, 'danger');
                showLoading(false);
            }
        }

        async function loadDocumentInfo() {
            try {
                console.log('📋 Загрузка информации о документе ID:', documentId);

                const response = await fetch(`/api/v1/documents/${documentId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const doc = await response.json();
                    console.log('📄 Полученные данные о документе:', doc);

                    document.getElementById('docId').textContent = doc.id;

                    if (doc.case_info) {
                        console.log('🏥 Информация о случае:', doc.case_info);
                        document.getElementById('patientName').textContent =
                            doc.case_info.name || 'Не указано';
                        document.getElementById('insuranceNumber').textContent =
                            doc.case_info.insurance_number || 'Не указан';
                    } else {
                        console.log('⚠️ Информация о случае не получена');
                        // Если case_info не пришёл, запрашиваем отдельно
                        await loadCaseInfo(doc.case_id);
                    }

                    document.getElementById('createdAt').textContent =
                        new Date(doc.created_at).toLocaleDateString('ru-RU');

                } else {
                    console.error('❌ Ошибка загрузки документа:', response.status);
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки информации о документе:', error);
            }
        }

        async function loadCaseInfo(caseId) {
            try {
                const response = await fetch(`/api/v1/cases/${caseId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const caseData = await response.json();
                    document.getElementById('patientName').textContent =
                        caseData.patient_name || 'Не указано';
                    document.getElementById('insuranceNumber').textContent =
                        caseData.patient_insurance || 'Не указан';
                }
            } catch (error) {
                console.error('Ошибка загрузки информации о случае:', error);
            }
        }

        function displayDocumentInfo() {
            document.getElementById('documentInfo').style.display = 'block';
            document.getElementById('doctorStatus').style.display = 'flex';
            document.getElementById('documentActions').style.display = 'block';
            document.getElementById('documentTable').style.display = 'block';

            // Показываем кнопку подписания только для заведующего и админа
            if (currentUser.role === 'head' || currentUser.role === 'admin') {
                document.getElementById('signDocumentBtn').style.display = 'inline-block';
            }
        }

        function displayDoctorStatus() {
            const neuroCard = document.getElementById('neurologistStatus');
            const therapistCard = document.getElementById('therapistStatus');
            const headCard = document.getElementById('headStatus');

            // Невролог
            if (completionStatus.neurologist) {
                neuroCard.classList.add('completed');
                document.getElementById('neurologistText').textContent = 'Заполнено';
                document.getElementById('neurologistText').style.color = '#27ae60';
            } else {
                neuroCard.classList.remove('completed');
                document.getElementById('neurologistText').textContent = 'Не заполнено';
                document.getElementById('neurologistText').style.color = '#e74c3c';
            }

            // Терапевт
            if (completionStatus.therapist) {
                therapistCard.classList.add('completed');
                document.getElementById('therapistText').textContent = 'Заполнено';
                document.getElementById('therapistText').style.color = '#27ae60';
            } else {
                therapistCard.classList.remove('completed');
                document.getElementById('therapistText').textContent = 'Не заполнено';
                document.getElementById('therapistText').style.color = '#e74c3c';
            }

            // Заведующий
            if (completionStatus.head) {
                headCard.classList.add('completed');
                document.getElementById('headText').textContent = 'Заполнено';
                document.getElementById('headText').style.color = '#27ae60';
            } else {
                headCard.classList.remove('completed');
                document.getElementById('headText').textContent = 'Не заполнено';
                document.getElementById('headText').style.color = '#e74c3c';
            }
        }

        function displayDocumentTable() {
            try {
                console.log('📊 Начинаем отображение таблицы...');
                console.log('📋 Данные документа:', documentData);

                const tableBody = document.getElementById('tableBody');
                if (!tableBody) {
                    console.error('❌ Элемент tableBody не найден!');
                    return;
                }

                tableBody.innerHTML = '';

                // Определяем строки в правильном порядке
                const rowOrder = [
                    'header',
                    'pain_syndrome',
                    'stato_dynamic',
                    'mental_functions',
                    'internal_organs',
                    'sensory_functions',
                    'vital_activity',
                    'self_care',
                    'mobility',
                    'work_ability',
                    'communication',
                    'total_score'
                ];

                rowOrder.forEach((rowKey, index) => {
                    const rowData = documentData[rowKey] || ["", "", ""];

                    const tr = document.createElement('tr');

                    // Определяем класс строки
                    if (rowKey === 'header') {
                        tr.classList.add('header-row');
                    } else if (rowKey === 'total_score') {
                        tr.classList.add('total-row');
                    }

                    // Определяем, к какому врачу относится строка
                    let doctorType = '';
                    let doctorName = '';
                    let canEdit = false;

                    try {
                        // Извлекаем строки как строковые значения
                        const neuroRows = (doctorRows?.neurologist || []).map(r => {
                            if (typeof r === 'string') return r;
                            if (r && typeof r === 'object') {
                                if ('value' in r) return r.value;
                                if ('name' in r) return r.name;
                                if ('key' in r) return r.key;
                            }
                            return String(r);
                        });

                        const therapistRows = (doctorRows?.therapist || []).map(r => {
                            if (typeof r === 'string') return r;
                            if (r && typeof r === 'object') {
                                if ('value' in r) return r.value;
                                if ('name' in r) return r.name;
                                if ('key' in r) return r.key;
                            }
                            return String(r);
                        });

                        const headRows = (doctorRows?.head || []).map(r => {
                            if (typeof r === 'string') return r;
                            if (r && typeof r === 'object') {
                                if ('value' in r) return r.value;
                                if ('name' in r) return r.name;
                                if ('key' in r) return r.key;
                            }
                            return String(r);
                        });

                        if (neuroRows.includes(rowKey)) {
                            doctorType = 'neurologist';
                            doctorName = 'Невролог';
                        } else if (therapistRows.includes(rowKey)) {
                            doctorType = 'therapist';
                            doctorName = 'Терапевт';
                        } else if (headRows.includes(rowKey)) {
                            doctorType = 'head';
                            doctorName = 'Заведующий';
                        }

                        // Проверяем, может ли текущий пользователь редактировать эту строку
                        if (permissions?.can_edit_all) {
                            canEdit = true;
                        } else if (doctorType === 'neurologist' && permissions?.can_edit_neurologist) {
                            canEdit = true;
                        } else if (doctorType === 'therapist' && permissions?.can_edit_therapist) {
                            canEdit = true;
                        } else if (doctorType === 'head' && permissions?.can_edit_head) {
                            canEdit = true;
                        }
                    } catch (error) {
                        console.error('Ошибка определения прав доступа для строки', rowKey, ':', error);
                    }

                    // Создаем ячейки с безопасными значениями
                    const rowTitle = rowData[0] || (() => {
                        // Заглушки для названий строк
                        const titles = {
                            'header': '',
                            'pain_syndrome': 'Болевой синдром',
                            'stato_dynamic': 'Нарушение стато-динамических функций',
                            'mental_functions': 'Нарушение психических функций',
                            'internal_organs': 'Нарушение функций внутренних органов',
                            'sensory_functions': 'Нарушение сенсорных функций',
                            'vital_activity': 'Нарушение жизнедеятельности',
                            'self_care': 'Нарушение самообслуживания',
                            'mobility': 'Нарушение способности к передвижению',
                            'work_ability': 'Нарушение способности к трудовой деятельности',
                            'communication': 'Нарушение способности к общению',
                            'total_score': 'Сумма баллов'
                        };
                        return titles[rowKey] || rowKey;
                    })();

                    tr.innerHTML = `
                        <td class="row-label">
                            ${rowTitle}
                            ${doctorName ? `<div class="row-doctor">${doctorName}</div>` : ''}
                        </td>
                        <td>
                            <input type="text"
                                   class="cell-input ${doctorType} ${canEdit ? '' : 'readonly'}"
                                   value="${(rowData[1] || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;')}"
                                   data-row="${rowKey}"
                                   data-col="1"
                                   ${canEdit ? '' : 'readonly'}
                                   oninput="debouncedMarkAsChanged('${rowKey}', 1, this.value)">
                        </td>
                        <td>
                            <input type="text"
                                   class="cell-input ${doctorType} ${canEdit ? '' : 'readonly'}"
                                   value="${(rowData[2] || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;')}"
                                   data-row="${rowKey}"
                                   data-col="2"
                                   ${canEdit ? '' : 'readonly'}
                                   oninput="debouncedMarkAsChanged('${rowKey}', 2, this.value)">
                        </td>
                    `;

                    tableBody.appendChild(tr);
                });

                console.log('✅ Таблица успешно отображена');
                console.log('🔍 Элементов input в таблице:', document.querySelectorAll('input[data-row]').length);

            } catch (error) {
                console.error('❌ Ошибка отображения таблицы:', error);
                showAlert('Ошибка отображения таблицы: ' + error.message, 'danger');
            }
        }

        // Дебаунс функция для уменьшения количества логов
        function debouncedMarkAsChanged(rowKey, colIndex, value) {
            const now = Date.now();
            if (now - lastInputTime > INPUT_DEBOUNCE) {
                markAsChanged(rowKey, colIndex, value);
                lastInputTime = now;
            }
        }

        function markAsChanged(rowKey, colIndex, value) {
            const changeId = `${rowKey}_${colIndex}`;
            unsavedChanges.add(changeId);
            updateSaveStatus();

            // Логируем только раз в 300ms и только при первом изменении
            if (unsavedChanges.size === 1) {
                console.log(`📝 Изменение: ${rowKey}_${colIndex} = "${value}"`);
                console.log(`   Несохраненных изменений: ${unsavedChanges.size}`);
            }
        }

        function updateSaveStatus() {
            const saveStatus = document.getElementById('saveStatus');
            if (unsavedChanges.size > 0) {
                saveStatus.textContent = `Есть несохраненные изменения (${unsavedChanges.size})`;
                saveStatus.style.color = '#f39c12';
            } else {
                saveStatus.textContent = 'Все изменения сохранены';
                saveStatus.style.color = '#27ae60';
            }
        }

        function setupAutoSave() {
            // Автосохранение каждые 30 секунд
            autoSaveTimer = setInterval(() => {
                if (unsavedChanges.size > 0) {
                    saveAllChanges();
                }
            }, 30000);
        }

        // Новая функция: собирает ВСЕ данные из таблицы
        function collectAllTableData() {
            const allData = {};
            const inputs = document.querySelectorAll('input[data-row]');

            inputs.forEach(input => {
                const rowKey = input.dataset.row;
                const colIndex = input.dataset.col;

                if (!allData[rowKey]) {
                    allData[rowKey] = ["", "", ""];
                    // Сохраняем название строки из documentData
                    if (documentData && documentData[rowKey]) {
                        allData[rowKey][0] = documentData[rowKey][0] || "";
                    }
                }

                if (colIndex === '1') {
                    allData[rowKey][1] = input.value || "";
                } else if (colIndex === '2') {
                    allData[rowKey][2] = input.value || "";
                }
            });

            return allData;
        }

        // Функция: собирает данные только для разрешенных строк текущего пользователя
        function collectMyTableData() {
            const userRole = currentUser.role;
            let allowedRows = [];

            // Определяем разрешенные строки для текущего пользователя
            if (userRole === 'neurologist') {
                const rows = doctorRows?.neurologist || [];
                allowedRows = rows.map(r => {
                    if (typeof r === 'string') return r;
                    if (r && typeof r === 'object') {
                        if ('value' in r) return r.value;
                        if ('name' in r) return r.name;
                        if ('key' in r) return r.key;
                    }
                    return String(r);
                });
            } else if (userRole === 'therapist') {
                const rows = doctorRows?.therapist || [];
                allowedRows = rows.map(r => {
                    if (typeof r === 'string') return r;
                    if (r && typeof r === 'object') {
                        if ('value' in r) return r.value;
                        if ('name' in r) return r.name;
                        if ('key' in r) return r.key;
                    }
                    return String(r);
                });
            } else if (userRole === 'head') {
                const rows = doctorRows?.head || [];
                allowedRows = rows.map(r => {
                    if (typeof r === 'string') return r;
                    if (r && typeof r === 'object') {
                        if ('value' in r) return r.value;
                        if ('name' in r) return r.name;
                        if ('key' in r) return r.key;
                    }
                    return String(r);
                });
            }

            const myData = {};
            const inputs = document.querySelectorAll('input[data-row]');

            inputs.forEach(input => {
                const rowKey = input.dataset.row;
                const colIndex = input.dataset.col;

                // Сохраняем только если строка разрешена
                if (allowedRows.includes(rowKey)) {
                    if (!myData[rowKey]) {
                        myData[rowKey] = ["", "", ""];
                        if (documentData && documentData[rowKey]) {
                            myData[rowKey][0] = documentData[rowKey][0] || "";
                        }
                    }

                    if (colIndex === '1') {
                        myData[rowKey][1] = input.value || "";
                    } else if (colIndex === '2') {
                        myData[rowKey][2] = input.value || "";
                    }
                }
            });

            return myData;
        }

                // Собираем ВСЕ данные из таблицы (более надежный способ)

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertClass = type === 'error' ? 'alert alert-danger' :
                             type === 'success' ? 'alert alert-success' :
                             type === 'warning' ? 'alert alert-warning' :
                             'alert alert-info';

            const alertDiv = document.createElement('div');
            alertDiv.className = alertClass;
            alertDiv.innerHTML = `
                ${message}
                <button style="float: right; background: none; border: none; font-size: 20px; cursor: pointer;"
                        onclick="this.parentElement.remove()">×</button>
            `;

            // Удаляем старые алерты
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            container.appendChild(alertDiv);

            // Автоматическое удаление через 5 секунд
            setTimeout(() => {
                if (alertDiv.parentNode === container) {
                    alertDiv.remove();
                }
            }, 5000);
        }
