<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование документа - ReUnityHandler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .patient-info {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin-bottom: 20px;
        }
        .case-status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .case-status-completed {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .doctor-status {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .status-card {
            flex: 1;
            min-width: 200px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }
        .status-card.completed {
            border-left: 4px solid #27ae60;
        }
        .status-card.pending {
            border-left: 4px solid #f39c12;
        }
        .status-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .document-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        .document-table th,
        .document-table td {
            border: 1px solid #ddd;
            padding: 12px;
            vertical-align: top;
        }
        .document-table th {
            background: #2c3e50;
            color: white;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
        }
        .document-table tr:nth-child(even) {
            background: #f9f9f9;
        }
        .document-table tr:hover {
            background: #f5f5f5;
        }
        .row-label {
            width: 50%;
            font-weight: bold;
            background: #f8f9fa;
        }
        .cell-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            box-sizing: border-box;
        }
        .cell-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        .cell-input.readonly {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        .cell-input.neurologist {
            border-left: 3px solid #3498db;
        }
        .cell-input.therapist {
            border-left: 3px solid #9b59b6;
        }
        .cell-input.head {
            border-left: 3px solid #e74c3c;
        }
        .row-doctor {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            display: inline-block;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover {
            background: #e67e22;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .total-row {
            background: #e8f4fc !important;
            font-weight: bold;
        }
        .header-row {
            background: #fff8e1 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Редактирование документа</h1>
            <div style="margin-top: 10px;">
                <button class="btn btn-secondary" onclick="window.location.href='/cases'">
                    ← Назад к списку случаев
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">
                    ← Панель управления
                </button>
            </div>
        </div>

        <div id="alertContainer"></div>
        <div id="loading" class="loading">Загрузка документа...</div>

        <div id="documentInfo" class="patient-info" style="display: none;">
            <h3>Информация о документе</h3>
            <p><strong>ID:</strong> <span id="docId"></span></p>
            <p><strong>Пациент:</strong> <span id="patientName"></span></p>
            <p><strong>Номер полиса:</strong> <span id="insuranceNumber"></span></p>
            <p><strong>Дата создания:</strong> <span id="createdAt"></span></p>
        </div>

        <!-- Блок сообщения о статусе случая -->
        <div id="caseStatusMessage" class="case-status-message" style="display: none;"></div>

        <div id="doctorStatus" class="doctor-status" style="display: none;">
            <div class="status-card" id="neurologistStatus">
                <div class="status-icon">🧠</div>
                <h4>Невролог</h4>
                <p id="neurologistText">Не заполнено</p>
                <p id="neurologistTime"></p>
            </div>
            <div class="status-card" id="therapistStatus">
                <div class="status-icon">🩺</div>
                <h4>Терапевт</h4>
                <p id="therapistText">Не заполнено</p>
                <p id="therapistTime"></p>
            </div>
            <div class="status-card" id="headStatus">
                <div class="status-icon">👨‍⚕️</div>
                <h4>Заведующий</h4>
                <p id="headText">Не заполнено</p>
                <p id="headTime"></p>
            </div>
        </div>

        <div id="documentActions" style="margin: 20px 0; display: none;">
            <!-- Обычные кнопки (показываются, если случай не завершён) -->
            <button class="btn btn-success" onclick="completeMySection()" id="completeSectionBtn">
                ✓ Завершить мой раздел
            </button>
            <button class="btn btn-warning" onclick="uncompleteMySection()" id="uncompleteSectionBtn" style="display: none;">
                ↩️ Отменить завершение раздела
            </button>
            <button class="btn btn-primary" onclick="saveAllChanges()" id="saveAllBtn">
                💾 Сохранить все изменения
            </button>
            <!-- Кнопка завершения случая (только для админа/зав., если случай не завершён и все разделы заполнены) -->
            <button class="btn btn-success" onclick="completeCaseFromDocument()" id="signDocumentBtn" style="display: none;">
                📝 Завершить случай
            </button>
            <!-- Кнопка отмены завершения случая (только для админа/зав., если случай завершён) -->
            <button class="btn btn-danger" onclick="uncompleteCase()" id="uncompleteCaseBtn" style="display: none;">
                ↩️ Отменить завершение случая
            </button>
            <button class="btn btn-primary" onclick="exportToWebmis()" id="exportWebmisBtn" style="display: none;">📤 Экспорт в ВебМИС</button>
            <span id="saveStatus" style="margin-left: 20px; color: #666;"></span>
        </div>

        <div id="documentTable" style="display: none;">
            <table class="document-table">
                <thead>
                    <tr>
                        <th>Показатель</th>
                        <th style="width: 25%;">До лечения</th>
                        <th style="width: 25%;">После лечения</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Таблица будет заполнена через JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('auth_token');
        let currentUser = null;
        let documentId = null;
        let documentData = null;
        let permissions = null;
        let doctorRows = null;
        let completionStatus = null;
        let unsavedChanges = new Set();
        let autoSaveTimer = null;
        let lastInputTime = 0;
        const INPUT_DEBOUNCE = 300;

        // Переменные для статуса случая и polling
        let caseStatus = null;          // Текущий статус случая (например, 'in_progress', 'completed')
        let caseId = null;              // ID случая, полученный из документа
        let pollingInterval = null;      // Интервал для опроса статуса случая

        const urlParams = new URLSearchParams(window.location.search);
        documentId = urlParams.get('id');

        if (!documentId) {
            showAlert('ID документа не указан', 'danger');
            setTimeout(() => window.location.href = '/cases', 2000);
        }

        if (!token) {
            window.location.href = '/';
        }

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    currentUser = await response.json();
                } else {
                    throw new Error('Ошибка загрузки пользователя');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                window.location.href = '/';
            }
        }

        async function loadDocumentStructure() {
            try {
                showLoading(true);
                console.log('🚀 Загрузка структуры документа...');

                const response = await fetch(`/api/v1/document-table/${documentId}/structure`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    documentData = data.table_data;
                    permissions = data.permissions;
                    doctorRows = data.doctor_rows;
                    completionStatus = data.completion_status;

                    console.log('📄 Полученные данные структуры:', data);

                    await updateSectionButtons();

                    await loadDocumentInfo();  // загружает информацию о документе и статус случая

                    displayDocumentInfo();
                    displayDoctorStatus();
                    displayDocumentTable();
                    setupAutoSave();

                    showLoading(false);
                } else {
                    throw new Error('Ошибка загрузки документа');
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки структуры документа:', error);
                showAlert('Ошибка загрузки документа: ' + error.message, 'danger');
                showLoading(false);
            }
        }

        async function loadDocumentInfo() {
            try {
                console.log('📋 Загрузка информации о документе ID:', documentId);

                const response = await fetch(`/api/v1/documents/${documentId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const doc = await response.json();
                    console.log('📄 Полученные данные о документе:', doc);

                    document.getElementById('docId').textContent = doc.id;

                    if (doc.case_info) {
                        document.getElementById('patientName').textContent = doc.case_info.name || 'Не указано';
                        document.getElementById('insuranceNumber').textContent = doc.case_info.insurance_number || 'Не указан';
                    } else {
                        await loadCaseInfo(doc.case_id);
                    }

                    document.getElementById('createdAt').textContent =
                        new Date(doc.created_at).toLocaleDateString('ru-RU');

                    // Сохраняем case_id и загружаем статус случая
                    if (doc.case_id) {
                        caseId = doc.case_id;
                        await fetchCaseStatus(caseId);
                        startPollingCaseStatus(); // запускаем периодическую проверку
                    }
                } else {
                    console.error('❌ Ошибка загрузки документа:', response.status);
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки информации о документе:', error);
            }
        }

        async function loadCaseInfo(caseId) {
            try {
                const response = await fetch(`/api/v1/cases/${caseId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const caseData = await response.json();
                    document.getElementById('patientName').textContent = caseData.patient_name || 'Не указано';
                    document.getElementById('insuranceNumber').textContent = caseData.patient_insurance || 'Не указан';
                }
            } catch (error) {
                console.error('Ошибка загрузки информации о случае:', error);
            }
        }

        // Загрузка статуса случая
        async function fetchCaseStatus(caseId) {
            try {
                const response = await fetch(`/api/v1/cases/${caseId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const caseData = await response.json();
                    // Если статус изменился, обновляем интерфейс
                    if (caseData.status !== caseStatus) {
                        caseStatus = caseData.status;
                        console.log('📌 Статус случая изменился:', caseStatus);
                        updateCaseStatusUI();
                        updateExportButtonVisibility();  // обновляем видимость кнопки экспорта
                    }
                } else {
                    console.error('Ошибка загрузки статуса случая:', response.status);
                }
            } catch (error) {
                console.error('Ошибка загрузки статуса случая:', error);
            }
        }

        async function exportToWebmis() {
            // Сохраняем все несохранённые изменения
            await saveAllChanges();

            // Собираем данные из таблицы
            const tableData = collectAllTableData();
            const exportData = {};

            for (const [row, values] of Object.entries(tableData)) {
                exportData[row + '_before'] = values[1] || '';
                exportData[row + '_after'] = values[2] || '';
            }

            // Добавляем метаданные
            exportData.document_id = documentId;
            exportData.case_id = caseId;
            exportData.exported_at = new Date().toISOString();

            // Получаем ФИО пациента
            const patientFullName = document.getElementById('patientName').textContent.trim() || 'Неизвестный';
            exportData.patient_name = patientFullName;

            // Формируем имя файла: Фамилия_И.О._ГГГГММДД_ЧЧММ.json
            const now = new Date();
            const dateStr = now.toISOString().slice(0,10).replace(/-/g, '');
            const timeStr = now.toTimeString().slice(0,5).replace(':', '');

            // Преобразуем ФИО в формат "Фамилия_И.О."
            let fileNamePart = 'export';
            if (patientFullName !== 'Неизвестный') {
                const parts = patientFullName.split(' ');
                if (parts.length >= 2) {
                    const lastName = parts[0];
                    const firstNameInitial = parts[1].charAt(0).toUpperCase();
                    const middleNameInitial = parts.length > 2 ? parts[2].charAt(0).toUpperCase() : '';
                    fileNamePart = `${lastName}_${firstNameInitial}.${middleNameInitial ? middleNameInitial + '.' : ''}`.replace(/\.$/, '');
                } else {
                    fileNamePart = patientFullName.replace(/\s+/g, '_');
                }
            }
            const fileName = `${fileNamePart}_${dateStr}_${timeStr}.json`;

            // Создаём и скачиваем JSON-файл
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Функция для обновления видимости кнопки экспорта
        function updateExportButtonVisibility() {
            const exportBtn = document.getElementById('exportWebmisBtn');
            if (!exportBtn) return;

            // Проверяем роль и статус случая
            const userRole = currentUser?.role;
            const isCaseCompleted = (caseStatus === 'completed');
            const canExport = (userRole === 'head' || userRole === 'admin') && isCaseCompleted;

            exportBtn.style.display = canExport ? 'inline-block' : 'none';
        }

        // Запуск периодического опроса статуса случая
        function startPollingCaseStatus() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => {
                if (caseId) {
                    fetchCaseStatus(caseId);
                }
            }, 5000); // каждые 5 секунд
        }

        // Остановка опроса (при уходе со страницы)
        function stopPollingCaseStatus() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        // Обновление интерфейса в зависимости от статуса случая
        function updateCaseStatusUI() {
            const caseMessageDiv = document.getElementById('caseStatusMessage');
            const actionsDiv = document.getElementById('documentActions');
            const completeSectionBtn = document.getElementById('completeSectionBtn');
            const uncompleteSectionBtn = document.getElementById('uncompleteSectionBtn');
            const saveAllBtn = document.getElementById('saveAllBtn');
            const signDocumentBtn = document.getElementById('signDocumentBtn');
            const uncompleteCaseBtn = document.getElementById('uncompleteCaseBtn');

            if (!caseStatus) return;

            const isCaseCompleted = (caseStatus === 'completed');

            if (isCaseCompleted) {
                caseMessageDiv.textContent = 'Случай завершён';
                caseMessageDiv.className = 'case-status-message case-status-completed';
                caseMessageDiv.style.display = 'block';

                // В зависимости от роли показываем разные элементы
                if (currentUser.role === 'admin' || currentUser.role === 'head') {
                    // Админ/зав.: показываем только кнопку отмены завершения случая
                    completeSectionBtn.style.display = 'none';
                    uncompleteSectionBtn.style.display = 'none';
                    saveAllBtn.style.display = 'none';
                    signDocumentBtn.style.display = 'none';
                    uncompleteCaseBtn.style.display = 'inline-block';
                } else {
                    // Невролог/терапевт: показываем только кнопку "Отменить завершение раздела" в disabled
                    completeSectionBtn.style.display = 'none';
                    uncompleteSectionBtn.style.display = 'inline-block';
                    uncompleteSectionBtn.disabled = true;
                    uncompleteSectionBtn.title = 'Недоступно, так как случай завершён';
                    saveAllBtn.style.display = 'none';
                    signDocumentBtn.style.display = 'none';
                    uncompleteCaseBtn.style.display = 'none';
                }
            } else {
                // Случай не завершён – показываем обычный интерфейс
                caseMessageDiv.style.display = 'none';
                actionsDiv.style.display = 'block';

                // Восстанавливаем обычное состояние кнопок (снимаем disabled)
                uncompleteSectionBtn.disabled = false;
                uncompleteSectionBtn.title = '';

                // Восстанавливаем видимость основных кнопок
                saveAllBtn.style.display = 'inline-block';
                // Кнопку завершения случая НЕ показываем принудительно – она будет показана
                // только если все разделы заполнены (через updateCompletionStatus)
                signDocumentBtn.style.display = 'none'; // сбрасываем на всякий случай
                uncompleteCaseBtn.style.display = 'none';

                // Вызываем updateSectionButtons для корректного отображения кнопок завершения/отмены раздела
                updateSectionButtons();
            }
        }

        function displayDocumentInfo() {
            document.getElementById('documentInfo').style.display = 'block';
            document.getElementById('doctorStatus').style.display = 'flex';
            document.getElementById('documentActions').style.display = 'block';
            document.getElementById('documentTable').style.display = 'block';

            // Первоначально кнопка завершения случая скрыта – будет показана при необходимости
            // (в updateCompletionStatus)
        }

        function displayDoctorStatus() {
            const neuroCard = document.getElementById('neurologistStatus');
            const therapistCard = document.getElementById('therapistStatus');
            const headCard = document.getElementById('headStatus');

            if (completionStatus.neurologist) {
                neuroCard.classList.add('completed');
                document.getElementById('neurologistText').textContent = 'Заполнено';
                document.getElementById('neurologistText').style.color = '#27ae60';
            } else {
                neuroCard.classList.remove('completed');
                document.getElementById('neurologistText').textContent = 'Не заполнено';
                document.getElementById('neurologistText').style.color = '#e74c3c';
            }

            if (completionStatus.therapist) {
                therapistCard.classList.add('completed');
                document.getElementById('therapistText').textContent = 'Заполнено';
                document.getElementById('therapistText').style.color = '#27ae60';
            } else {
                therapistCard.classList.remove('completed');
                document.getElementById('therapistText').textContent = 'Не заполнено';
                document.getElementById('therapistText').style.color = '#e74c3c';
            }

            if (completionStatus.head) {
                headCard.classList.add('completed');
                document.getElementById('headText').textContent = 'Заполнено';
                document.getElementById('headText').style.color = '#27ae60';
            } else {
                headCard.classList.remove('completed');
                document.getElementById('headText').textContent = 'Не заполнено';
                document.getElementById('headText').style.color = '#e74c3c';
            }
        }

        function updateSectionButtons() {
            const completeBtn = document.getElementById('completeSectionBtn');
            const uncompleteBtn = document.getElementById('uncompleteSectionBtn');
            const userRole = currentUser?.role;

            if (!completionStatus) return;

            // Сбрасываем disabled (если случай не завершён, кнопка должна быть активна)
            uncompleteBtn.disabled = false;
            uncompleteBtn.title = '';

            let isCompleted = false;
            if (userRole === 'neurologist') isCompleted = completionStatus.neurologist;
            else if (userRole === 'therapist') isCompleted = completionStatus.therapist;
            else if (userRole === 'head') isCompleted = completionStatus.head;
            else if (userRole === 'admin') {
                completeBtn.style.display = 'none';
                uncompleteBtn.style.display = 'none';
                return;
            }

            if (isCompleted) {
                completeBtn.style.display = 'none';
                uncompleteBtn.style.display = 'inline-block';
            } else {
                completeBtn.style.display = 'inline-block';
                uncompleteBtn.style.display = 'none';
            }
        }

        function displayDocumentTable() {
            try {
                console.log('📊 Начинаем отображение таблицы...');
                console.log('📋 Данные документа:', documentData);

                const tableBody = document.getElementById('tableBody');
                if (!tableBody) {
                    console.error('❌ Элемент tableBody не найден!');
                    return;
                }

                tableBody.innerHTML = '';

                const rowOrder = [
                    'header',
                    'pain_syndrome',
                    'stato_dynamic',
                    'mental_functions',
                    'internal_organs',
                    'sensory_functions',
                    'vital_activity',
                    'self_care',
                    'mobility',
                    'work_ability',
                    'communication',
                    'total_score'
                ];

                const isCaseCompleted = (caseStatus === 'completed');

                rowOrder.forEach(rowKey => {
                    const rowData = documentData[rowKey] || ["", "", ""];
                    const tr = document.createElement('tr');

                    if (rowKey === 'header') tr.classList.add('header-row');
                    else if (rowKey === 'total_score') tr.classList.add('total-row');

                    let doctorType = '';
                    let doctorName = '';
                    let canEdit = false;

                    try {
                        const neuroRows = (doctorRows?.neurologist || []).map(r =>
                            typeof r === 'string' ? r : (r.value || r.name || r.key || String(r))
                        );
                        const therapistRows = (doctorRows?.therapist || []).map(r =>
                            typeof r === 'string' ? r : (r.value || r.name || r.key || String(r))
                        );
                        const headRows = (doctorRows?.head || []).map(r =>
                            typeof r === 'string' ? r : (r.value || r.name || r.key || String(r))
                        );

                        if (neuroRows.includes(rowKey)) {
                            doctorType = 'neurologist';
                            doctorName = 'Невролог';
                        } else if (therapistRows.includes(rowKey)) {
                            doctorType = 'therapist';
                            doctorName = 'Терапевт';
                        } else if (headRows.includes(rowKey)) {
                            doctorType = 'head';
                            doctorName = 'Заведующий';
                        }

                        // Блокировка редактирования, если раздел завершён
                        let isSectionCompleted = false;
                        if (doctorType === 'neurologist') isSectionCompleted = completionStatus?.neurologist;
                        else if (doctorType === 'therapist') isSectionCompleted = completionStatus?.therapist;
                        else if (doctorType === 'head') isSectionCompleted = completionStatus?.head;

                        // Определяем возможность редактирования с учётом статуса случая
                        if (isCaseCompleted) {
                            // Если случай завершён, редактирование запрещено всем
                            canEdit = false;
                        } else {
                            // Иначе проверяем права доступа (если раздел не завершён)
                            if (!isSectionCompleted) {
                                if (permissions?.can_edit_all) {
                                    canEdit = true;
                                } else if (doctorType === 'neurologist' && permissions?.can_edit_neurologist) {
                                    canEdit = true;
                                } else if (doctorType === 'therapist' && permissions?.can_edit_therapist) {
                                    canEdit = true;
                                } else if (doctorType === 'head' && permissions?.can_edit_head) {
                                    canEdit = true;
                                }
                            } else {
                                canEdit = false; // раздел завершён – никому нельзя
                            }
                        }
                    } catch (error) {
                        console.error('Ошибка определения прав для строки', rowKey, ':', error);
                    }

                    // Заголовок строки
                    const rowTitle = rowKey === 'header' ? 'Дата' : (rowData[0] || (() => {
                        const titles = {
                            'pain_syndrome': 'Болевой синдром',
                            'stato_dynamic': 'Нарушение стато-динамических функций',
                            'mental_functions': 'Нарушение психических функций',
                            'internal_organs': 'Нарушение функций внутренних органов',
                            'sensory_functions': 'Нарушение сенсорных функций',
                            'vital_activity': 'Нарушение жизнедеятельности',
                            'self_care': 'Нарушение самообслуживания',
                            'mobility': 'Нарушение способности к передвижению',
                            'work_ability': 'Нарушение способности к трудовой деятельности',
                            'communication': 'Нарушение способности к общению',
                            'total_score': 'Сумма баллов'
                        }[rowKey] || rowKey;
                    })());

                    // Формируем ячейки
                    let col1Html, col2Html;

                    if (rowKey === 'header') {
                        col1Html = `<input type="date"
                                    class="cell-input ${doctorType} ${canEdit ? '' : 'readonly'}"
                                    value="${(rowData[1] || '').replace(/"/g, '&quot;')}"
                                    data-row="${rowKey}"
                                    data-col="1"
                                    ${canEdit ? '' : 'readonly'}
                                    oninput="debouncedMarkAsChanged('${rowKey}', 1, this.value)">`;

                        col2Html = `<input type="date"
                                    class="cell-input ${doctorType} ${canEdit ? '' : 'readonly'}"
                                    value="${(rowData[2] || '').replace(/"/g, '&quot;')}"
                                    data-row="${rowKey}"
                                    data-col="2"
                                    ${canEdit ? '' : 'readonly'}
                                    oninput="debouncedMarkAsChanged('${rowKey}', 2, this.value)">`;
                    } else {
                        col1Html = `<input type="text"
                                    class="cell-input ${doctorType} ${canEdit ? '' : 'readonly'}"
                                    value="${(rowData[1] || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;')}"
                                    data-row="${rowKey}"
                                    data-col="1"
                                    ${canEdit ? '' : 'readonly'}
                                    oninput="debouncedMarkAsChanged('${rowKey}', 1, this.value)">`;

                        col2Html = `<input type="text"
                                    class="cell-input ${doctorType} ${canEdit ? '' : 'readonly'}"
                                    value="${(rowData[2] || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;')}"
                                    data-row="${rowKey}"
                                    data-col="2"
                                    ${canEdit ? '' : 'readonly'}
                                    oninput="debouncedMarkAsChanged('${rowKey}', 2, this.value)">`;
                    }

                    tr.innerHTML = `
                        <td class="row-label">
                            ${rowTitle}
                            ${doctorName ? `<div class="row-doctor">${doctorName}</div>` : ''}
                        </td>
                        <td>${col1Html}</td>
                        <td>${col2Html}</td>
                    `;

                    tableBody.appendChild(tr);
                });

                console.log('✅ Таблица успешно отображена');
                console.log('🔍 Элементов input в таблице:', document.querySelectorAll('input[data-row]').length);
            } catch (error) {
                console.error('❌ Ошибка отображения таблицы:', error);
                showAlert('Ошибка отображения таблицы: ' + error.message, 'danger');
            }
        }

        function debouncedMarkAsChanged(rowKey, colIndex, value) {
            const now = Date.now();
            if (now - lastInputTime > INPUT_DEBOUNCE) {
                markAsChanged(rowKey, colIndex, value);
                lastInputTime = now;
            }
        }

        function markAsChanged(rowKey, colIndex, value) {
            const changeId = `${rowKey}_${colIndex}`;
            unsavedChanges.add(changeId);
            updateSaveStatus();

            if (unsavedChanges.size === 1) {
                console.log(`📝 Изменение: ${rowKey}_${colIndex} = "${value}"`);
                console.log(`   Несохраненных изменений: ${unsavedChanges.size}`);
            }
        }

        function updateSaveStatus() {
            const saveStatus = document.getElementById('saveStatus');
            if (unsavedChanges.size > 0) {
                saveStatus.textContent = `Есть несохраненные изменения (${unsavedChanges.size})`;
                saveStatus.style.color = '#f39c12';
            } else {
                saveStatus.textContent = 'Все изменения сохранены';
                saveStatus.style.color = '#27ae60';
            }
        }

        function setupAutoSave() {
            autoSaveTimer = setInterval(() => {
                if (unsavedChanges.size > 0) {
                    saveAllChanges();
                }
            }, 30000);
        }

        function collectAllTableData() {
            const allData = {};
            const inputs = document.querySelectorAll('input[data-row]');
            inputs.forEach(input => {
                const rowKey = input.dataset.row;
                const colIndex = input.dataset.col;

                if (!allData[rowKey]) {
                    allData[rowKey] = ["", "", ""];
                    if (documentData && documentData[rowKey]) {
                        allData[rowKey][0] = documentData[rowKey][0] || "";
                    }
                }
                if (colIndex === '1') {
                    allData[rowKey][1] = input.value || "";
                } else if (colIndex === '2') {
                    allData[rowKey][2] = input.value || "";
                }
            });
            return allData;
        }

        function collectMyTableData() {
            const userRole = currentUser.role;
            let allowedRows = [];

            if (userRole === 'neurologist') {
                allowedRows = (doctorRows?.neurologist || []).map(r =>
                    typeof r === 'string' ? r : (r.value || r.name || r.key || String(r))
                );
            } else if (userRole === 'therapist') {
                allowedRows = (doctorRows?.therapist || []).map(r =>
                    typeof r === 'string' ? r : (r.value || r.name || r.key || String(r))
                );
            } else if (userRole === 'head') {
                allowedRows = (doctorRows?.head || []).map(r =>
                    typeof r === 'string' ? r : (r.value || r.name || r.key || String(r))
                );
            }

            const myData = {};
            const inputs = document.querySelectorAll('input[data-row]');
            inputs.forEach(input => {
                const rowKey = input.dataset.row;
                const colIndex = input.dataset.col;

                if (allowedRows.includes(rowKey)) {
                    if (!myData[rowKey]) {
                        myData[rowKey] = ["", "", ""];
                        if (documentData && documentData[rowKey]) {
                            myData[rowKey][0] = documentData[rowKey][0] || "";
                        }
                    }
                    if (colIndex === '1') {
                        myData[rowKey][1] = input.value || "";
                    } else if (colIndex === '2') {
                        myData[rowKey][2] = input.value || "";
                    }
                }
            });
            return myData;
        }

        async function saveAllChanges() {
            if (unsavedChanges.size === 0) {
                console.log('📭 Нет изменений для сохранения');
                return;
            }

            try {
                console.log('💾 Начинаем сохранение всех изменений...');
                console.log('📋 Изменений для сохранения:', unsavedChanges.size);

                const allData = collectAllTableData();
                console.log('📦 Все данные таблицы:', allData);

                for (const rowKey in allData) {
                    const rowUpdate = {
                        row_name: rowKey,
                        values: [allData[rowKey][1], allData[rowKey][2]]
                    };

                    console.log('📤 Отправка строки:', rowKey, rowUpdate.values);

                    try {
                        const response = await fetch(`/api/v1/document-table/${documentId}/row`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(rowUpdate)
                        });

                        if (response.ok) {
                            const result = await response.json();
                            console.log('✅ Ответ сервера для строки', rowKey, ':', result);

                            if (!documentData[rowKey]) {
                                documentData[rowKey] = ["", "", ""];
                            }
                            documentData[rowKey][1] = allData[rowKey][1];
                            documentData[rowKey][2] = allData[rowKey][2];
                        } else {
                            const errorText = await response.text();
                            console.error('❌ Ошибка сервера для строки', rowKey, ':', response.status, errorText);
                        }
                    } catch (fetchError) {
                        console.error('❌ Ошибка сети при сохранении строки', rowKey, ':', fetchError);
                    }
                }

                unsavedChanges.clear();
                updateSaveStatus();

                await updateCompletionStatus();

                showAlert('Изменения сохранены', 'success');
                console.log('🎉 Все изменения успешно сохранены!');

            } catch (error) {
                console.error('❌ Критическая ошибка сохранения:', error);
                showAlert('Ошибка сохранения: ' + error.message, 'danger');
            }
        }

        async function completeMySection() {
            await saveMyChangesOnly();

            if (!confirm('Вы уверены, что завершили заполнение вашего раздела? После завершения редактирование будет ограничено.')) {
                return;
            }

            try {
                const response = await fetch(`/api/v1/document-table/${documentId}/complete-section`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert(result.message || 'Раздел отмечен как заполненный', 'success');

                    await updateCompletionStatus();
                    await loadDocumentStructure();
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка завершения раздела');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Ошибка: ' + error.message, 'danger');
            }
        }

        async function uncompleteMySection() {
            if (!confirm('Вы уверены, что хотите отменить завершение раздела? Редактирование снова станет доступным.')) {
                return;
            }

            try {
                const response = await fetch(`/api/v1/document-table/${documentId}/uncomplete-my-section`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert(result.message || 'Завершение раздела отменено', 'success');
                    await loadDocumentStructure();
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка отмены завершения');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Ошибка: ' + error.message, 'danger');
            }
        }

        async function saveMyChangesOnly() {
            try {
                console.log('👤 Сохранение изменений только для текущего пользователя...');

                const myData = collectMyTableData();
                console.log('📦 Данные текущего пользователя:', myData);

                if (Object.keys(myData).length === 0) {
                    console.log('📭 Нет данных для сохранения');
                    return;
                }

                for (const rowKey in myData) {
                    const rowUpdate = {
                        row_name: rowKey,
                        values: [myData[rowKey][1], myData[rowKey][2]]
                    };

                    console.log('📤 Отправка строки пользователя:', rowKey, rowUpdate.values);

                    try {
                        const response = await fetch(`/api/v1/document-table/${documentId}/row`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(rowUpdate)
                        });

                        if (response.ok) {
                            const result = await response.json();
                            console.log('✅ Ответ сервера для строки', rowKey, ':', result);

                            if (!documentData[rowKey]) {
                                documentData[rowKey] = ["", "", ""];
                            }
                            documentData[rowKey][1] = myData[rowKey][1];
                            documentData[rowKey][2] = myData[rowKey][2];
                        } else {
                            const errorText = await response.text();
                            console.error('❌ Ошибка сервера для строки', rowKey, ':', response.status, errorText);
                        }
                    } catch (fetchError) {
                        console.error('❌ Ошибка сети при сохранении строки', rowKey, ':', fetchError);
                    }
                }

                unsavedChanges.clear();
                updateSaveStatus();

                console.log('✅ Изменения пользователя сохранены');

            } catch (error) {
                console.error('❌ Ошибка сохранения своих изменений:', error);
                throw error;
            }
        }

        async function updateCompletionStatus() {
            try {
                const response = await fetch(`/api/v1/document-table/${documentId}/completion-status`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const status = await response.json();
                    completionStatus = {
                        neurologist: status.neurologist.completed,
                        therapist: status.therapist.completed,
                        head: status.head.completed
                    };
                    displayDoctorStatus();
                    await updateSectionButtons();

                    // Показываем кнопку завершения случая только если все разделы заполнены,
                    // пользователь админ/зав. И случай ещё не завершён
                    if (status.all_completed && (currentUser.role === 'head' || currentUser.role === 'admin') && caseStatus !== 'completed') {
                        document.getElementById('signDocumentBtn').style.display = 'inline-block';
                    } else {
                        // Иначе скрываем
                        document.getElementById('signDocumentBtn').style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Ошибка обновления статуса:', error);
            }
        }

        // Функция завершения случая (вызывает /cases/{caseId}/complete)
        async function completeCaseFromDocument() {
            if (!caseId) {
                showAlert('ID случая не найден', 'danger');
                return;
            }
            if (!confirm('Вы уверены, что хотите завершить случай? После завершения редактирование будет невозможно.')) {
                return;
            }

            try {
                const response = await fetch(`/api/v1/cases/${caseId}/complete`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('Случай успешно завершён', 'success');
                    await fetchCaseStatus(caseId); // обновит интерфейс
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка завершения случая');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Ошибка: ' + error.message, 'danger');
            }
        }

        // Функция отмены завершения случая
        async function uncompleteCase() {
            if (!confirm('Вы уверены, что хотите отменить завершение случая? После отмены редактирование снова станет возможным.')) {
                return;
            }

            try {
                const response = await fetch(`/api/v1/cases/${caseId}/uncomplete`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert(result.message || 'Завершение случая отменено', 'success');
                    await fetchCaseStatus(caseId);
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка отмены завершения случая');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Ошибка: ' + error.message, 'danger');
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertClass = type === 'error' ? 'alert alert-danger' :
                             type === 'success' ? 'alert alert-success' :
                             type === 'warning' ? 'alert alert-warning' :
                             'alert alert-info';

            const alertDiv = document.createElement('div');
            alertDiv.className = alertClass;
            alertDiv.innerHTML = `
                ${message}
                <button style="float: right; background: none; border: none; font-size: 20px; cursor: pointer;"
                        onclick="this.parentElement.remove()">×</button>
            `;

            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            container.appendChild(alertDiv);

            setTimeout(() => {
                if (alertDiv.parentNode === container) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadDocumentStructure();

            window.addEventListener('beforeunload', (e) => {
                if (unsavedChanges.size > 0) {
                    e.preventDefault();
                    e.returnValue = 'У вас есть несохраненные изменения. Вы уверены, что хотите уйти?';
                }
                stopPollingCaseStatus(); // останавливаем polling при уходе
            });
        });
    </script>
</body>
</html>
