<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление врачами - ReUnityHandler</title>
    <style>
        :root {
            --bg-light: #fffffa;
            --primary-dark: #0d5c63;
            --primary-medium: #44a1a0;
            --primary-light: #78cdd7;
            --primary-deep: #247b7b;
            --text-dark: #2c3e50;
            --text-light: #ffffff;
            --border-color: #b0d4d9;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #78cdd7 0%, #44a1a0 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(13, 92, 99, 0.9);
            color: var(--text-light);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }
        #user-info-header {
            background: var(--primary-dark);
            color: white;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1em;
        }
        .admin-nav {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .admin-nav .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .admin-nav .btn.active {
            background: var(--primary-medium);
            border-color: var(--primary-medium);
        }
        .content {
            background: #ffffff;
            padding: 20px;
            border-radius: 5px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background-color: var(--primary-dark);
            color: white;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
            display: inline-block;
        }
        .btn-primary { background: var(--primary-medium); color: white; }
        .btn-success { background: var(--primary-deep); color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-secondary { background: var(--primary-light); color: var(--text-dark); }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: var(--bg-light);
            margin: 10% auto;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            max-width: 90%;
        }
        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="user-info-header">
            <span id="userName"></span>
            <span id="userRole"></span>
        </div>

        <div class="header">
            <h1>Управление врачами</h1>
            <div class="admin-nav">
                <button class="btn active" onclick="window.location.href='/admin/doctors'">👨‍⚕️ Врачи</button>
                <button class="btn" onclick="window.location.href='/patients'">👥 Пациенты</button>
                <button class="btn" onclick="window.location.href='/dashboard'">← Назад в панель управления</button>
            </div>
        </div>

        <div class="content">
            <div id="alertContainer"></div>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn btn-success" onclick="openCreateModal()">＋ Добавить врача</button>
                <button class="btn btn-primary" id="saveStatusSettingsBtn">💾 Сохранить настройки статусов</button>
            </div>
            <div id="loading" class="loading">Загрузка списка врачей...</div>
            <div id="doctorsTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ФИО</th>
                            <th>Логин</th>
                            <th>Роль</th>
                            <th>Активен</th>
                            <th>Показывать в статусах</th>
                            <th>Порядок</th>
                            <th>Создан</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="doctorsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно для создания/редактирования врача -->
    <div id="doctorModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Добавление врача</h3>
            <form id="doctorForm">
                <input type="hidden" id="doctorId">
                <div class="form-group">
                    <label for="lastName">Фамилия *</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="firstName">Имя *</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="middleName">Отчество</label>
                    <input type="text" id="middleName">
                </div>
                <div class="form-group">
                    <label for="username">Логин *</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Роль *</label>
                    <select id="role" required>
                        <option value="reflexotherapist">Рефлексотерапевт</option>
                        <option value="physiotherapist">Физиотерапевт</option>
                        <option value="therapist_frm">Терапевт/Врач ФРМ</option>
                        <option value="neurologist_frm">Невролог/Врач ФРМ</option>
                        <option value="psychologist">Психолог</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="isActive">Активен</label>
                    <input type="checkbox" id="isActive" checked>
                </div>
                <div style="text-align: right;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно для смены пароля -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePasswordModal()">&times;</span>
            <h3>Смена пароля врача</h3>
            <form id="passwordForm">
                <input type="hidden" id="passwordDoctorId">
                <div class="form-group">
                    <label for="newPassword">Новый пароль *</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Подтверждение *</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div style="text-align: right;">
                    <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сменить пароль</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = '/';
        }

        let currentUser = null;
        let doctors = [];

        function getRoleName(role) {
            const roles = {
                'reflexotherapist': 'Рефлексотерапевт',
                'physiotherapist': 'Физиотерапевт',
                'therapist_frm': 'Терапевт/Врач ФРМ',
                'neurologist_frm': 'Невролог/Врач ФРМ',
                'psychologist': 'Психолог',
                'admin': 'Администратор'
            };
            return roles[role] || role;
        }

        function disableButton(btn, disable, loadingText = 'Сохранение...') {
            if (disable) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.textContent = loadingText;
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || btn.textContent;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadDoctors();
        });

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('userName').textContent = currentUser.full_name;
                    document.getElementById('userRole').textContent = getRoleName(currentUser.role);
                    if (currentUser.role !== 'admin') {
                        window.location.href = '/dashboard';
                    }
                } else {
                    throw new Error('Ошибка загрузки пользователя');
                }
            } catch (error) {
                console.error(error);
                window.location.href = '/';
            }
        }

        async function loadDoctors() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('doctorsTable').style.display = 'none';

                const response = await fetch('/api/v1/doctors?active_only=false', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    doctors = await response.json();
                    displayDoctors(doctors);
                } else {
                    showAlert('Ошибка загрузки врачей', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayDoctors(doctors) {
            const tbody = document.getElementById('doctorsTableBody');
            tbody.innerHTML = '';

            doctors.forEach(doc => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${doc.id}</td>
                    <td>${doc.last_name} ${doc.first_name} ${doc.middle_name || ''}</td>
                    <td>${doc.username}</td>
                    <td>${getRoleName(doc.role)}</td>
                    <td>${doc.is_active ? 'Да' : 'Нет'}</td>
                    <td style="text-align: center;">
                        <input type="checkbox" class="status-show-chk" data-id="${doc.id}" ${doc.show_in_status ? 'checked' : ''} ${!doc.is_active ? 'disabled' : ''}>
                    </td>
                    <td>
                        <input type="number" class="status-order-input" data-id="${doc.id}" value="${doc.status_order || 0}" style="width: 70px;" ${!doc.is_active ? 'disabled' : ''}>
                    </td>
                    <td>${new Date(doc.created_at).toLocaleDateString('ru-RU')}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editDoctor(${doc.id})">✏️</button>
                        <button class="btn btn-secondary btn-sm" onclick="openPasswordModal(${doc.id}, '${doc.full_name}')">🔑</button>
                        ${doc.id !== currentUser.id ? `<button class="btn btn-danger btn-sm" onclick="deleteDoctor(${doc.id})">🗑️</button>` : ''}
                        ${doc.is_active ?
                            `<button class="btn btn-secondary btn-sm" onclick="toggleActive(${doc.id}, false)">🔒 Деактивировать</button>` :
                            `<button class="btn btn-success btn-sm" onclick="toggleActive(${doc.id}, true)">🔓 Активировать</button>`
                        }
                    </td>
                `;
            });

            document.getElementById('doctorsTable').style.display = 'block';
        }

        // Сохранение настроек статусов
        document.getElementById('saveStatusSettingsBtn').addEventListener('click', async () => {
            const settings = [];
            document.querySelectorAll('.status-show-chk').forEach(chk => {
                const id = parseInt(chk.dataset.id);
                const orderInput = document.querySelector(`.status-order-input[data-id="${id}"]`);
                const order = orderInput ? parseInt(orderInput.value) || 0 : 0;
                settings.push({
                    id: id,
                    show_in_status: chk.checked,
                    status_order: order
                });
            });

            try {
                const response = await fetch('/api/v1/doctors/status-settings', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(settings)
                });

                if (response.ok) {
                    showAlert('Настройки статусов сохранены', 'success');
                    await loadDoctors(); // обновим таблицу
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка сохранения', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            }
        });

        // --- Остальные функции (создание, редактирование, удаление, активация, смена пароля) ---
        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Добавление врача';
            document.getElementById('doctorId').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('firstName').value = '';
            document.getElementById('middleName').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('password').required = true;
            document.getElementById('role').value = 'reflexotherapist';
            document.getElementById('isActive').checked = true;
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('doctorModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('doctorModal').style.display = 'none';
        }

        async function editDoctor(id) {
            const doctor = doctors.find(d => d.id === id);
            if (!doctor) return;

            document.getElementById('modalTitle').textContent = 'Редактирование врача';
            document.getElementById('doctorId').value = doctor.id;
            document.getElementById('lastName').value = doctor.last_name;
            document.getElementById('firstName').value = doctor.first_name;
            document.getElementById('middleName').value = doctor.middle_name || '';
            document.getElementById('username').value = doctor.username;
            document.getElementById('password').value = '';
            document.getElementById('password').required = false;
            document.getElementById('role').value = doctor.role;
            document.getElementById('isActive').checked = doctor.is_active;
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('doctorModal').style.display = 'block';
        }

        document.getElementById('doctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('doctorId').value;
            const isEditing = !!id;

            const data = {
                last_name: document.getElementById('lastName').value.trim(),
                first_name: document.getElementById('firstName').value.trim(),
                middle_name: document.getElementById('middleName').value.trim() || null,
                username: document.getElementById('username').value.trim(),
                role: document.getElementById('role').value,
                is_active: document.getElementById('isActive').checked
            };

            if (!isEditing) {
                data.password = document.getElementById('password').value;
                if (!data.password) {
                    showAlert('Пароль обязателен при создании', 'danger');
                    return;
                }
            }

            const url = isEditing ? `/api/v1/doctors/${id}` : '/api/v1/doctors/';
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert(isEditing ? 'Врач обновлён' : 'Врач создан', 'success');
                    closeModal();
                    await loadDoctors();
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка сохранения', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            }
        });

        async function deleteDoctor(id) {
            if (!confirm('Вы уверены, что хотите удалить этого врача? Это действие необратимо.')) return;

            try {
                const response = await fetch(`/api/v1/doctors/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('Врач удалён', 'success');
                    await loadDoctors();
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка удаления', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            }
        }

        async function toggleActive(id, activate) {
            const doctor = doctors.find(d => d.id === id);
            if (!doctor) return;

            if (activate) {
                const activeDoctor = doctors.find(d => d.role === doctor.role && d.is_active && d.id !== id);
                if (activeDoctor) {
                    if (!confirm(`Врач ${activeDoctor.full_name} (${getRoleName(activeDoctor.role)}) уже активен. Он будет деактивирован. Продолжить?`)) {
                        return;
                    }
                }
            }

            const action = activate ? 'activate' : 'deactivate';
            try {
                const response = await fetch(`/api/v1/doctors/${id}/${action}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert(activate ? 'Врач активирован' : 'Врач деактивирован', 'success');
                    await loadDoctors();
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка изменения статуса', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            }
        }

        function openPasswordModal(doctorId, doctorName) {
            document.getElementById('passwordDoctorId').value = doctorId;
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('passwordModal').style.display = 'block';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const doctorId = document.getElementById('passwordDoctorId').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (newPassword !== confirm) {
                showAlert('Пароли не совпадают', 'danger');
                return;
            }
            if (newPassword.length < 4) {
                showAlert('Пароль должен быть не менее 4 символов', 'danger');
                return;
            }

            try {
                const response = await fetch(`/api/v1/doctors/${doctorId}/set-password`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ new_password: newPassword })
                });

                if (response.ok) {
                    showAlert('Пароль успешно изменён', 'success');
                    closePasswordModal();
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Ошибка смены пароля', 'danger');
                }
            } catch (error) {
                console.error(error);
                showAlert('Ошибка подключения к серверу', 'danger');
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            container.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('doctorModal');
            if (event.target === modal) closeModal();
            const pwdModal = document.getElementById('passwordModal');
            if (event.target === pwdModal) closePasswordModal();
        };
    </script>
</body>
</html>
