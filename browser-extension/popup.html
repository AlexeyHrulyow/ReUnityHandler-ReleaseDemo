<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 15px; font-family: Arial, sans-serif; }
    input[type="file"] { width: 100%; margin-bottom: 15px; }
    button { width: 100%; padding: 10px; background: #007c8d; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0a6a80; }
    #status { margin-top: 15px; font-size: 14px; }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <h3>Импорт из ReUnityHandler</h3>
  <input type="file" id="fileInput" accept=".json">
  <button id="importBtn">Импортировать</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
